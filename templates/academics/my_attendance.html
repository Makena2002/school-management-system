{% extends 'base.html' %}
{% block title %}My Attendance{% endblock %}
{% block content %}
<h2>My Attendance</h2>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Date</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody>
        {% for record in records %}
        <tr>
            <td>{{ record.date }}</td>
            <td>{{ record.get_status_display }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="2">No attendance records yet.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
