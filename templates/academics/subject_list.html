{% extends 'base.html' %}
{% block title %}Subjects{% endblock %}
{% block content %}
<h2>Subjects</h2>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Name</th>
            <th>Code</th>
        </tr>
    </thead>
    <tbody>
        {% for subject in subjects %}
        <tr>
            <td>{{ subject.name }}</td>
            <td>{{ subject.code }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
