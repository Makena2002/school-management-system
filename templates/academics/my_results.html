{% extends 'base.html' %}
{% block title %}My Results{% endblock %}
{% block content %}
<h2>My Results</h2>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Term</th>
            <th>Subject</th>
            <th>Score</th>
        </tr>
    </thead>
    <tbody>
        {% for record in records %}
        <tr>
            <td>{{ record.term }}</td>
            <td>{{ record.subject.name }}</td>
            <td>{{ record.score }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="3">No results yet.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
